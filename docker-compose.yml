services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kotoba_loop}
      MYSQL_USER: ${MYSQL_USER:-kotoba}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kotoba_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    environment:
      PORT: 8080
      MYSQL_DSN: ${MYSQL_USER:-kotoba}:${MYSQL_PASSWORD:-kotoba_dev}@tcp(db:3306)/${MYSQL_DATABASE:-kotoba_loop}?parseTime=true
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      WEB_ORIGIN: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports: ["8080:8080"]
  importer:
    build: ./backend
    command: ["/kotoba-import"]
    profiles: ["tools"]
    environment:
      MYSQL_DSN: ${MYSQL_USER:-kotoba}:${MYSQL_PASSWORD:-kotoba_dev}@tcp(db:3306)/${MYSQL_DATABASE:-kotoba_loop}?parseTime=true
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    depends_on: [api]
    ports: ["5173:5173"]
volumes:
  mysql_data:
